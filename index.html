<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Kosmetik Cantik</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f6f6f6;
}
header {
  background: #e91e63;
  color: white;
  padding: 15px;
  text-align: center;
}
.container {
  width: 90%;
  margin: auto;
}
.controls {
  display: flex;
  gap: 10px;
  margin: 20px 0;
  flex-wrap: wrap;
}
.controls input, .controls select {
  padding: 10px;
  width: 100%;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
}
.product {
  background: white;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  position: relative;
}
.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: #ff5722;
  color: white;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 5px;
}
.product img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
.old-price {
  text-decoration: line-through;
  color: gray;
}
.price {
  color: #e91e63;
  font-weight: bold;
  font-size: 18px;
}
button {
  background: #e91e63;
  color: white;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 5px;
  cursor: pointer;
}
.cart {
  background: white;
  padding: 15px;
  margin: 30px 0;
  border-radius: 8px;
}
.cart button {
  background: #25D366;
  margin-top: 10px;
}
footer {
  background: #ddd;
  padding: 15px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <h1>Toko Kosmetik Cantik</h1>
  <p>Murah • Lengkap • Terpercaya</p>
</header>

<div class="container">

<div class="controls">
  <input type="text" placeholder="Cari produk..." onkeyup="searchProduct(this.value)">
  <select onchange="filterCategory(this.value)">
    <option value="all">Semua Kategori</option>
    <option value="makeup">Makeup</option>
    <option value="skincare">Skincare</option>
  </select>
</div>

<div class="products" id="productList"></div>

<div class="cart">
  <h2>Keranjang Belanja</h2>
  <ul id="cartItems"></ul>
  <h3>Total: Rp <span id="total">0</span></h3>
  <button onclick="checkout()">Pesan via WhatsApp</button>
</div>

</div>

<footer>
  <p>Hubungi Penjual: WhatsApp 08xxxxxxxxxx</p>
  <p>&copy; 2025 Toko Kosmetik Cantik</p>
</footer>

<script>
// ===== DATA PRODUK =====
const products = [
  {name:"Lipstik Matte", old:50000, price:25000, cat:"makeup", badge:"Promo",
   img:"https://images.unsplash.com/photo-1585238342028-4bbc9f1c47e4"},
  {name:"Foundation Natural", old:70000, price:45000, cat:"makeup", badge:"Best Seller",
   img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be"},
  {name:"Bedak Compact", old:45000, price:30000, cat:"makeup", badge:"",
   img:"https://images.unsplash.com/photo-1596461404969-9ae70f2830c1"},
  {name:"Maskara Waterproof", old:40000, price:28000, cat:"makeup", badge:"Promo",
   img:"https://images.unsplash.com/photo-1590156576816-97b3c25b06d0"},
  {name:"Skincare Glow", old:60000, price:35000, cat:"skincare", badge:"Promo",
   img:"https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd"},
  {name:"Serum Wajah", old:65000, price:40000, cat:"skincare", badge:"",
   img:"https://images.unsplash.com/photo-1580870069867-74c57ee1bb07"},
  {name:"Facial Wash", old:30000, price:20000, cat:"skincare", badge:"",
   img:"https://images.unsplash.com/photo-1615485737651-6f07c0f1e58a"}
];

// ===== TAMPILKAN PRODUK =====
const productList = document.getElementById("productList");
  const products = [
  {
    name: "Lipstik Matte",
    old: 50000,
    price: 25000,
    cat: "makeup",
    badge: "Promo",
    img: "https://images.unsplash.com/photo-1585238342028-4bbc9f1c47e4?auto=format&fit=crop&w=500&q=80"
  },
  {
    name: "Foundation Natural",
    old: 70000,
    price: 45000,
    cat: "makeup",
    badge: "Best Seller",
    img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=500&q=80"
  },
  {
    name: "Bedak Compact",
    old: 45000,
    price: 30000,
    cat: "makeup",
    badge: "",
    img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=500&q=80"
  },
  {
    name: "Maskara Waterproof",
    old: 40000,
    price: 28000,
    cat: "makeup",
    badge: "Promo",
    img: "https://images.unsplash.com/photo-1590156576816-97b3c25b06d0?auto=format&fit=crop&w=500&q=80"
  },
  {
    name: "Serum Wajah",
    old: 65000,
    price: 40000,
    cat: "skincare",
    badge: "Promo",
    img: "https://images.unsplash.com/photo-1580870069867-74c57ee1bb07?auto=format&fit=crop&w=500&q=80"
  },
  {
    name: "Skincare Glow",
    old: 60000,
    price: 35000,
    cat: "skincare",
    badge: "",
    img: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd?auto=format&fit=crop&w=500&q=80"
  }
];


function renderProducts(list) {
  productList.innerHTML = "";
  list.forEach(p => {
    productList.innerHTML += `
    <div class="product">
      ${p.badge ? `<span class="badge">${p.badge}</span>` : ""}
      <img src="${p.img}">
      <h3>${p.name}</h3>
      <p class="old-price">Rp ${p.old}</p>
      <p class="price">Rp ${p.price}</p>
      <button onclick="addToCart('${p.name}', ${p.price})">
        Tambah ke Keranjang
      </button>
    </div>`;
  });
}
renderProducts(products);

// ===== SEARCH & FILTER =====
function searchProduct(keyword) {
  document.querySelectorAll(".product").forEach(p => {
    const name = p.querySelector("h3").innerText.toLowerCase();
    p.style.display = name.includes(keyword.toLowerCase()) ? "" : "none";
  });
}

function filterCategory(cat) {
  if (cat === "all") {
    renderProducts(products);
  } else {
    renderProducts(products.filter(p => p.cat === cat));
  }
}

// ===== KERANJANG =====
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({name, price});
  total += price;
  renderCart();
}

function renderCart() {
  const list = document.getElementById("cartItems");
  list.innerHTML = "";
  cart.forEach(item => {
    list.innerHTML += `<li>${item.name} - Rp ${item.price}</li>`;
  });
  document.getElementById("total").innerText = total;
}

// ===== PEMESANAN WA =====
function checkout() {
  let pesan = "Halo, saya mau pesan:%0A";
  cart.forEach(i => pesan += `- ${i.name} (Rp ${i.price})%0A`);
  pesan += `%0ATotal: Rp ${total}`;
  window.open("https://wa.me/628XXXXXXXXXX?text=" + pesan);
}
</script>

</body>
</html>

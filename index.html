<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Kosmetik Cantik</title>

<style>
body { font-family: Arial; margin: 0; background: #f8f8f8; }
header { background: #e91e63; color: #fff; padding: 15px; text-align: center; }
.container { width: 90%; margin: auto; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
.controls input, .controls select {
  padding: 10px; width: 100%;
}
.controls select { max-width: 220px; }

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
  gap: 20px;
}

.product {
  background: #fff; padding: 15px; border-radius: 8px;
  position: relative; text-align: center;
}
.badge {
  position: absolute; top: 10px; left: 10px;
  background: #ff5722; color: #fff; padding: 4px 8px;
  font-size: 12px; border-radius: 5px;
}
.product img {
  width: 100%; height: 200px; object-fit: cover; border-radius: 8px;
}
.old-price { text-decoration: line-through; color: gray; }
.price { color: #e91e63; font-weight: bold; font-size: 18px; }
button {
  background: #e91e63; color: #fff; border: none;
  padding: 10px; width: 100%; border-radius: 5px; cursor: pointer;
}

.cart {
  background: #fff; margin: 30px 0; padding: 15px; border-radius: 8px;
}
.cart button { background: #25D366; }
.remove { background:#999; margin-top:5px; }
</style>
</head>

<body>

<header>
  <h1>Toko Kosmetik Cantik</h1>
  <p>Murah • Promo • Banyak Pilihan</p>
</header>

<div class="container">

  <div class="controls">
    <input type="text" placeholder="Cari produk..." onkeyup="searchProduct(this.value)">
    <select onchange="filterCategory(this.value)">
      <option value="all">Semua Kategori</option>
      <option value="makeup">Makeup</option>
      <option value="skincare">Skincare</option>
      <option value="promo">Promo</option>
    </select>
  </div>

  <div class="products" id="productList"></div>

  <div class="cart">
    <h2>Keranjang</h2>
    <ul id="cartItems"></ul>
    <h3>Total: Rp <span id="total">0</span></h3>
    <button onclick="checkout()">Checkout WhatsApp</button>
  </div>

</div>

<script>
// ===== DATA PRODUK =====
const products = [
  {name:"Lipstik Matte", old:50000, price:25000, badge:"Promo", cat:"makeup", img:"https://images.unsplash.com/photo-1585238342028-4bbc9f1c47e4"},
  {name:"Foundation", old:70000, price:45000, badge:"Best Seller", cat:"makeup", img:"https://images.unsplash.com/photo-1620916566398-39f1143ab7be"},
  {name:"Bedak ", old:45000, price:30000, badge:"", cat:"makeup", img:"https://images.unsplash.com/photo-1596461404969-9ae70f2830c1"},
  {name:"Maskara wajah", old:40000, price:28000, badge:"Promo", cat:"makeup", img:"https://images.unsplash.com/photo-1590156576816-97b3c25b06d0"},
  {name:"Skincare Glow", old:60000, price:35000, badge:"Promo", cat:"skincare", img:"https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd"},
  {name:"Serum Wajah", old:65000, price:40000, badge:"", cat:"skincare", img:"https://images.unsplash.com/photo-1580870069867-74c57ee1bb07"},
  {name:"Facial Wash", old:30000, price:20000, badge:"", cat:"skincare", img:"https://images.unsplash.com/photo-1615485737651-6f07c0f1e58a"}
];

// ===== RENDER PRODUK =====
const products = [
  {
    name: "Lipstik Matte",
    old: 50000,
    price: 25000,
    badge: "Promo",
    cat: "makeup",
    img: "https://images.unsplash.com/photo-1585238342028-4bbc9f1c47e4"
  },
  {
    name: "Foundation Natural",
    old: 70000,
    price: 45000,
    badge: "Best Seller",
    cat: "makeup",
    img: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be"
  },
  {
    name: "Bedak Compact",
    old: 45000,
    price: 30000,
    badge: "",
    cat: "makeup",
    img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1"
  },
  {
    name: "Maskara Waterproof",
    old: 40000,
    price: 28000,
    badge: "Promo",
    cat: "makeup",
    img: "https://images.unsplash.com/photo-1590156576816-97b3c25b06d0"
  },
  {
    name: "Skincare Glow",
    old: 60000,
    price: 35000,
    badge: "Promo",
    cat: "skincare",
    img: "https://images.unsplash.com/photo-1611930022073-b7a4ba5fcccd"
  },
  {
    name: "Serum Wajah",
    old: 65000,
    price: 40000,
    badge: "",
    cat: "skincare",
    img: "https://images.unsplash.com/photo-1580870069867-74c57ee1bb07"
  },
  {
    name: "Facial Wash",
    old: 30000,
    price: 20000,
    badge: "",
    cat: "skincare",
    img: "https://images.unsplash.com/photo-1615485737651-6f07c0f1e58a"
  }
];

renderProducts(products);

// ===== SEARCH & FILTER =====
function searchProduct(keyword){
  document.querySelectorAll(".product").forEach(p=>{
    const name = p.querySelector("h3").innerText.toLowerCase();
    p.style.display = name.includes(keyword.toLowerCase()) ? "" : "none";
  });
}
function filterCategory(cat){
  renderProducts(cat==="all" ? products : products.filter(p=>p.cat===cat));
}

// ===== KERANJANG (localStorage) =====
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = cart.reduce((s,i)=>s+i.price,0);
renderCart();

function addToCart(name, price){
  cart.push({name, price});
  total += price;
  saveCart();
  renderCart();
}
function removeItem(index){
  total -= cart[index].price;
  cart.splice(index,1);
  saveCart();
  renderCart();
}
function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}
function renderCart(){
  const list = document.getElementById("cartItems");
  list.innerHTML = "";
  cart.forEach((i,idx)=>{
    list.innerHTML += `
      <li>${i.name} - Rp ${i.price}
        <button class="remove" onclick="removeItem(${idx})">Hapus</button>
      </li>`;
  });
  document.getElementById("total").innerText = total;
}

// ===== CHECKOUT WA =====
function checkout(){
  let text = "Halo, saya mau pesan:%0A";
  cart.forEach(i=> text += `- ${i.name} (Rp ${i.price})%0A`);
  text += `%0ATotal: Rp ${total}`;
  window.open("https://wa.me/628XXXXXXXXXX?text="+text);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Toko Kosmetik </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            margin: 0;
            padding: 0;
        }

        header {
            background: #ff69b4;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product h3 {
            margin: 10px 0 5px;
        }

        .product p {
            color: #ff1493;
            font-weight: bold;
        }

        button {
            background: #ff69b4;
            border: none;
            padding: 10px;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #ff1493;
        }

        .cart {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        footer {
            background: #ff69b4;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Toko Glow Beauty Store 💄</h1>
    <p>Kosmetik Aman & Favorit </p>
</header>

<div class="container">
    <h2>🛍️ Produk Best Seller</h2>

    <div class="products">
        <div class="product">
            <img src="images/lip-tint.jpg" alt="Lip Tint">
            <h3>Lip Tint </h3>
            <p>Rp 25.000</p>
            <button onclick="addToCart('Lip Tint Natural')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="images/lip-cream.jpg" alt="Lip Cream">
            <h3>Lip Cream </h3>
            <p>Rp 30.000</p>
            <button onclick="addToCart('Lip Cream Remaja')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="images/bedak.jpg" alt="Bedak">
            <h3>Bedak Tabur</h3>
            <p>Rp 28.000</p>
            <button onclick="addToCart('Bedak Tabur')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="images/sunscreen.jpg" alt="Sunscreen">
            <h3>Sunscreen </h3>
            <p>Rp 40.000</p>
            <button onclick="addToCart('Sunscreen SPF 30')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="images/mascara.jpg" alt="Mascara">
            <h3>Mascara </h3>
            <p>Rp 22.000</p>
            <button onclick="addToCart('Mascara Natural')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="images/blush.jpg" alt="Blush On">
            <h3>Blush On Pink</h3>
            <p>Rp 27.000</p>
            <button onclick="addToCart('Blush On Pink')">Tambah ke Keranjang</button>
        </div>
    </div>

    <div class="cart">
        <h2>🛒 Keranjang Belanja</h2>
        <ul id="cartList"></ul>
        <button onclick="orderWhatsApp()">Pesan via WhatsApp</button>
    </div>
</div>

<footer>
    <p>📞 Hubungi Penjual: 087764145896</p>
    <p>© 2025 Glow Beauty Store</p>
</footer>

<script>
    let cart = [];

    function addToCart(product) {
        cart.push(product);
        updateCart();
    }

    function updateCart() {
        let list = document.getElementById("cartList");
        list.innerHTML = "";
        cart.forEach(item => {
            let li = document.createElement("li");
            li.textContent = item;
            list.appendChild(li);
        });
    }

    function orderWhatsApp() {
        if (cart.length === 0) {
            alert("Keranjang masih kosong!");
            return;
        }
        let message = "Halo, saya mau pesan:%0A" + cart.join("%0A");
        window.open("https://wa.me/628xxxxxxxxxx?text=" + message, "_blank");
    }
   
</script>

</body>
</html>

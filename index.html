<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Kosmetik Cantik</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f8f8f8;
}
header {
    background: #e91e63;
    color: white;
    padding: 15px;
    text-align: center;
}
.container {
    width: 90%;
    margin: auto;
}
.search {
    margin: 20px 0;
}
.search input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 20px;
}
.product {
    background: white;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}
.product img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}
.product h3 {
    margin: 10px 0;
}
.product button {
    background: #e91e63;
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    border-radius: 5px;
}
.cart {
    margin: 30px 0;
    background: white;
    padding: 15px;
    border-radius: 8px;
}
.cart ul {
    list-style: none;
    padding: 0;
}
footer {
    text-align: center;
    padding: 15px;
    background: #ddd;
}
</style>
</head>

<body>

<header>
    <h1>Toko Kosmetik Cantik</h1>
    <p>Makeup & Skincare Berkualitas</p>
</header>

<div class="container">

    <div class="search">
        <input type="text" id="searchInput" placeholder="Cari produk kosmetik..." onkeyup="searchProduct()">
    </div>

    <div class="products" id="productList">
        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Lipstik Matte</h3>
            <p>Rp 75.000</p>
            <button onclick="addToCart('Lipstik Matte')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Foundation Natural</h3>
            <p>Rp 120.000</p>
            <button onclick="addToCart('Foundation Natural')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Skincare Glow</h3>
            <p>Rp 150.000</p>
            <button onclick="addToCart('Skincare Glow')">Tambah ke Keranjang</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/200" alt="">
            <h3>Bedak Compact</h3>
            <p>Rp 90.000</p>
            <button onclick="addToCart('Bedak Compact')">Tambah ke Keranjang</button>
        </div>
    </div>

    <div class="cart">
        <h2>Keranjang Belanja</h2>
        <ul id="cartItems"></ul>
    </div>

</div>

<footer>
    <p>&copy; 2025 Toko Kosmetik Cantik</p>
</footer>

<script>
let cart = [];

function addToCart(product) {
    cart.push(product);
    renderCart();
}

function renderCart() {
    let cartList = document.getElementById("cartItems");
    cartList.innerHTML = "";
    cart.forEach(item => {
        let li = document.createElement("li");
        li.textContent = item;
        cartList.appendChild(li);
    });
}

function searchProduct() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let products = document.getElementsByClassName("product");
    for (let i = 0; i < products.length; i++) {
        let name = products[i].getElementsByTagName("h3")[0].innerText.toLowerCase();
        products[i].style.display = name.includes(input) ? "" : "none";
    }
}
</script>

</body>
</html>
